  <script>
    // ┌──────────────────────────────────────────────────────────────────┐
    // │  STEP 1 — PASTE YOUR CDN URL BETWEEN THE QUOTES BELOW           │
    // │                                                                  │
    // │  Where to get it:                                                │
    // │    Salesforce → Data Cloud Setup → Websites & Mobile Apps       │
    // │    → [Your connector] → Integration Guide → CDN Script URL      │
    // │                                                                  │
    // │  Format: https://cdn.c360a.salesforce.com/beacon/c360a/         │
    // │          YOUR_CONNECTOR_ID/scripts/c360a.min.js                 │
    // │                                                                  │
    // │  Leave as "" to run in standalone demo mode (no Data 360)       │
    // └──────────────────────────────────────────────────────────────────┘
    var CLEARWATER_SDK_URL = "https://cdn.c360a.salesforce.com/beacon/c360a/a198b0dd-bf2c-41d2-a733-3de2837b0bc2/scripts/c360a.min.js";

    // ── Internal state ────────────────────────────────────────────────
    window.__cwSDKReady = false;
    window.__cwPersonalizationData = {};

    // ── Inject SDK script dynamically ────────────────────────────────
    if (CLEARWATER_SDK_URL) {
      var _sdkScript = document.createElement("script");
      _sdkScript.src = CLEARWATER_SDK_URL;
      _sdkScript.async = true;
      _sdkScript.onload  = function() { console.log("[Clearwater] SDK script loaded from CDN."); };
      _sdkScript.onerror = function() { console.error("[Clearwater] SDK script FAILED to load. Check your CDN URL in CLEARWATER_SDK_URL."); };
      document.head.appendChild(_sdkScript);
    } else {
      console.info("[Clearwater] CLEARWATER_SDK_URL is empty — running in standalone demo mode. Set it to connect to Salesforce Data 360.");
    }

    // ── Poll for SDK readiness (every 500ms, up to 30 attempts = 15s) ─
    // The sitemap sets window.__cwSDKReady = true inside its init().then()
    // callback. We poll for that flag since SalesforceInteractions is not
    // exposed as a window global — it only exists in the sitemap context.
    var _sdkPollCount = 0;
    var _sdkPollTimer = setInterval(function() {
      _sdkPollCount++;
      if (window.__cwSDKReady === true) {
        clearInterval(_sdkPollTimer);
        window.dispatchEvent(new Event("clearwater:sdk-ready"));
        console.log("[Clearwater] ✓ SDK ready (confirmed by sitemap).");
      } else if (_sdkPollCount >= 30) {
        clearInterval(_sdkPollTimer);
        if (CLEARWATER_SDK_URL) {
          console.warn("[Clearwater] SDK URL is set but sitemap did not signal ready after 15s. Check the Console for sitemap errors.");
        }
      }
    }, 500);

    // ── Personalization response listener ─────────────────────────────
    // Receives responses dispatched by the sitemap after fetch() calls.
    window.addEventListener("clearwater:personalization", function(e) {
      window.__cwPersonalizationData[e.detail.page] = e.detail.response;
      console.log("[Clearwater] Personalization response →", e.detail.page, e.detail.response);
      window.dispatchEvent(new Event("clearwater:refresh"));
    });
  </script>

    // ── Reusable Live Personalization Hook ───────────────────────────
    // Returns live data from Salesforce Personalization for any point on any page.
    // Resets when persona changes. Listens for clearwater:refresh events.
    //
    // Usage:
    //   const liveAttrs = useLivePoint("home", "Homepage_Hero_Banner", persona);
    //   // liveAttrs.attributes = {Headline: "...", Subheadline: "..."}
    //   // liveAttrs.data = [{id: "...", attributes: {Name: "...", ...}}]  (for recommendations)
    //   // liveAttrs = null if no live decision
    //
    function useLivePoint(page, pointName, persona) {
      const [live, setLive] = useState(null);
      useEffect(function() {
        setLive(null); // reset on persona change
        var handler = function() {
          var pageData = window.__cwPersonalizationData && window.__cwPersonalizationData[page];
          if (!pageData) return;
          var list = pageData.personalizations || [];
          var found = null;
          for (var i = 0; i < list.length; i++) {
            if (list[i].personalizationPointName === pointName) { found = list[i]; break; }
          }
          if (found) {
            // Dynamic content: check attributes have real values
            var hasAttrs = found.attributes && Object.keys(found.attributes).some(function(k) { return found.attributes[k] && found.attributes[k] !== ""; });
            // Recommendations: check data array has items
            var hasData = found.data && found.data.length > 0;
            if (hasAttrs || hasData) {
              setLive(found);
              console.log("[Clearwater UI] ✓ Live data for", pointName, hasData ? "(recommendations:" + found.data.length + ")" : "(dynamic content)");
            } else {
              setLive(null);
            }
          }
        };
        handler();
        window.addEventListener("clearwater:refresh", handler);
        return function() { window.removeEventListener("clearwater:refresh", handler); };
      }, [page, pointName, persona]);
      return live;
    }

      return data.map(function(item) {
        var cat = (item.attributes && (item.attributes.PrimaryProductCategory || item.attributes.Primary_Product_Category || "")) || "";

          name: (item.attributes && (item.attributes.Name || item.attributes.name)) || item.id,

          tagColor: catColors[cat] || C.blue,
          imageUrl: item.attributes && (item.attributes.ImageUrl__c || item.attributes.imageUrl),
          id: item.id,
        };
      });
    }

    // Helper: look up name, fallback to truncated ID
    function getDecisionName(id) {
      if (!id) return "Live";
      if (DECISION_NAMES[id]) return DECISION_NAMES[id];
      // Fallback: show short ID for debugging
      return id.length > 18 ? id.substring(0, 18) + "…" : id;

    // ── Persona Zone Wrapper ─────────────────────────────────────────
    function PZone({ zoneName, pointName, decision, rule, children, show, style:outerStyle={} }) {
      if (!show) return <div style={outerStyle}>{children}</div>;

      // Check if a real Salesforce Personalization decision exists for this point
      const [liveInfo, setLiveInfo] = useState(null);
      useEffect(() => {
        const check = () => {
          const allPageData = Object.values(window.__cwPersonalizationData || {});
          var found = null;
          for (var i = 0; i < allPageData.length; i++) {
            var list = (allPageData[i] && allPageData[i].personalizations) || [];
            for (var j = 0; j < list.length; j++) {
              var pp = list[j];
              if (pp.personalizationPointName === pointName || pp.name === pointName) {
                var hasAttrs = pp.attributes && Object.keys(pp.attributes).some(function(k) { return pp.attributes[k] && pp.attributes[k] !== ""; });
                var hasData = pp.data && pp.data.length > 0;
                if (hasAttrs || hasData) {
                  found = pp;
                  break;
                }
              }
            }
            if (found) break;
          }
          setLiveInfo(found);
        };
        check();
        window.addEventListener("clearwater:refresh", check);
        return () => window.removeEventListener("clearwater:refresh", check);
      }, [pointName]);

      var isLive = !!liveInfo;
      var decisionLabel = isLive
        ? "⚡ " + getDecisionName(liveInfo.decisionId || liveInfo.personalizationId)
        : decision;

                        );
                      })}
                    </div>
                  </div>
                </PZone>
              </div>

              {/* Sticky card — right side */}
              <div style={{ position:"sticky", top:120 }}>
                <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:16, overflow:"hidden", boxShadow:"0 4px 24px rgba(15,42,74,0.08)" }}>
                  <div style={{ background:C.navy, padding:"20px 22px" }}>
                    <div style={{ fontSize:10.5, color:"rgba(255,255,255,0.4)", fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase", marginBottom:6 }}>Featured Rate</div>
                    <div style={{ fontSize:40, fontWeight:700, color:persona === "premier" ? C.gold : "#93C5FD", fontFamily:"'Playfair Display',Georgia,serif", lineHeight:1 }}>{persona === "premier" ? "5.65%" : "5.40%"}</div>
                    <div style={{ fontSize:13, color:"rgba(255,255,255,0.5)", marginTop:4 }}>p.a. · 12 month term</div>
                  </div>
                  <div style={{ padding:"20px 22px" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:10 }}>
                      <span style={{ color:C.textMd }}>Minimum deposit</span><span style={{ fontWeight:700, color:C.text }}>$5,000</span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:10 }}>
                      <span style={{ color:C.textMd }}>Interest payment</span><span style={{ fontWeight:700, color:C.text }}>At maturity</span>
                    </div>
                    <div style={{ display:"flex", justifyContent:"space-between", fontSize:14, marginBottom:20 }}>
                      <span style={{ color:C.textMd }}>Government guarantee</span><span style={{ fontWeight:700, color:C.green }}>Up to $250k</span>
                    </div>
                    <button style={{ width:"100%", padding:"14px 0", background:persona === "premier" ? C.gold : C.blue, color:"#fff", border:"none", borderRadius:10, fontSize:15, fontWeight:700, cursor:"pointer", marginBottom:10 }}>
                      Open Term Deposit →
                    </button>
                    <button style={{ width:"100%", padding:"11px 0", background:"transparent", border:`1.5px solid ${C.border}`, borderRadius:10, fontSize:13, color:C.slate, cursor:"pointer" }}>Compare rates</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── AWAC Chat ────────────────────────────────────────────────────
    const CHAT_RESPONSES = {
      home:    { text:"Great question — buying your first home is a big step! Based on your recent browsing, our First Home Buyer Package looks like a strong fit. Here are a few options to explore:", products:["First Home Buyer Package — 5.89% p.a.","Home Loan Pre-Approval (Free & instant)","Repayment Calculator"] },
      invest:  { text:"Smart thinking. For building wealth over time, I'd look at a mix of managed investments and term deposits. Here's what our wealth team recommends:", products:["Premier Investment Portfolio","Term Deposit — 5.40% p.a.","Book a Wealth Consultation"] },
      save:    { text:"The fastest way to grow savings is to link them to your everyday account. Our Everyday Savings earns 5.10% p.a. with zero fees — takes 3 minutes to open:", products:["Everyday Savings — 5.10% p.a.","Clearwater Savings Goals Tool","Automatic round-up feature"] },
      business:{ text:"For business banking, it really depends on your cashflow needs. Here's what we recommend for businesses at your stage:", products:["Business Growth Loan — from 6.20%","Business Transaction Account (No fees)","Speak to a Business Specialist"] },
    };
    function AWACChat({ open, onClose }) {
      const [messages, setMessages] = useState([{ role:"agent", text:"Hi! I'm your Clearwater Financial Advisor, powered by Agentforce and Salesforce Personalization. What can I help you with today?", products:null }]);
      const [input, setInput] = useState("");
      const [typing, setTyping] = useState(false);
      const endRef = useRef(null);
      const send = () => {
        const txt = input.trim(); if (!txt) return;
        setInput(""); setMessages(prev => [...prev,{ role:"user", text:txt, products:null }]); setTyping(true);
        setTimeout(() => {
          const low = txt.toLowerCase();
          const key = low.includes("home")||low.includes("buy")||low.includes("mortgage") ? "home" : low.includes("invest")||low.includes("wealth") ? "invest" : low.includes("business") ? "business" : "save";
          const r = CHAT_RESPONSES[key];
          setMessages(prev => [...prev,{ role:"agent", text:r.text, products:r.products }]); setTyping(false);
        }, 1400);
      };
      useEffect(() => { endRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages, typing]);
      if (!open) return null;
      return (
        <div style={{ position:"fixed", bottom:88, right:24, width:360, maxHeight:520, background:C.white, borderRadius:20, boxShadow:"0 12px 48px rgba(15,42,74,0.2)", border:`1px solid ${C.border}`, display:"flex", flexDirection:"column", overflow:"hidden", zIndex:300 }}>
          <div style={{ background:C.navy, padding:"14px 18px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
            <div style={{ display:"flex", gap:10, alignItems:"center" }}>
              <div style={{ width:36, height:36, borderRadius:"50%", background:C.blue, display:"flex", alignItems:"center", justifyContent:"center" }}><Bot size={18} color="#fff"/></div>
              <div>
                <div style={{ fontSize:14, fontWeight:700, color:"#fff" }}>Clearwater Advisor</div>
                <div style={{ fontSize:10.5, color:"#86EFAC", display:"flex", alignItems:"center", gap:5 }}><span style={{ width:6, height:6, borderRadius:"50%", background:"#86EFAC", display:"inline-block" }}/>Agentforce + Salesforce Personalization</div>
              </div>
            </div>
            <button onClick={onClose} style={{ background:"none", border:"none", color:"rgba(255,255,255,0.5)", cursor:"pointer" }}><X size={17}/></button>
          </div>
          <div style={{ flex:1, overflowY:"auto", padding:16, display:"flex", flexDirection:"column", gap:12 }}>
            {messages.map((m,i) => (
              <div key={i} style={{ display:"flex", flexDirection:"column", alignItems:m.role==="user" ? "flex-end" : "flex-start" }}>
                <div style={{ maxWidth:"86%", background:m.role==="user" ? C.blue : C.bg, color:m.role==="user" ? "#fff" : C.text, borderRadius:12, padding:"10px 14px", fontSize:13.5, lineHeight:1.5 }}>{m.text}</div>
                {m.products && (
                  <div style={{ marginTop:8, display:"flex", flexDirection:"column", gap:6, width:"100%" }}>
                    {m.products.map((prod,j) => (
                      <button key={j} style={{ textAlign:"left", background:C.blueLt, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 12px", fontSize:12.5, color:C.navy, cursor:"pointer", fontWeight:500, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                        {prod}<ChevronRight size={12} color={C.blue}/>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            ))}
            {typing && <div style={{ background:C.bg, borderRadius:12, padding:"10px 14px", fontSize:13, color:C.textMd, width:"fit-content" }}>Clearwater Advisor is typing…</div>}
            <div ref={endRef}/>
          </div>
          <div style={{ padding:"10px 14px", borderTop:`1px solid ${C.border}`, display:"flex", gap:8 }}>
            <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key==="Enter" && send()} placeholder="Ask about home loans, savings…" style={{ flex:1, border:`1px solid ${C.border}`, borderRadius:8, padding:"8px 12px", fontSize:13, outline:"none", fontFamily:"Inter,system-ui,sans-serif" }}/>
            <button onClick={send} style={{ background:C.blue, border:"none", borderRadius:8, width:38, height:38, display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", flexShrink:0 }}><Send size={14} color="#fff"/></button>
          </div>
        </div>
      );
    }

    // ── SDK Status helpers ────────────────────────────────────────────
    // These allow React components to check SDK status and get real
    // personalization decisions when available, falling back to mock data.

    function useSDKStatus() {
      const [sdkReady, setSDKReady] = useState(!!window.__cwSDKReady);
      useEffect(() => {
        // Already ready (SDK loaded before React mounted)
        if (window.__cwSDKReady) { setSDKReady(true); return; }
        // Listen for the event dispatched by the polling code in <head>
        const handler = () => setSDKReady(true);
        window.addEventListener("clearwater:sdk-ready", handler);
        return () => window.removeEventListener("clearwater:sdk-ready", handler);
      }, []);
      return sdkReady;
    }

    // Returns real personalization decision data for a given page + point name.
    // Falls back to null if SDK is not connected or no decision was returned.
    // Usage: const decision = useDecision("home", "Homepage_Hero_Banner");
    //        if (decision) { /* use decision.data */ } else { /* use mock */ }
    function useDecision(page, pointName) {
      const [decision, setDecision] = useState(null);
      useEffect(() => {
        const update = () => {
          const pageData = window.__cwPersonalizationData?.[page];
          if (!pageData) return;
          // The Decisioning API response has personalizations array
          const personalizations = pageData.personalizations || pageData;
          if (!Array.isArray(personalizations)) return;
          const found = personalizations.find(
            p => p.personalizationPointName === pointName || p.name === pointName
          );
          if (found?.data?.length) setDecision(found);
        };
        update();
        window.addEventListener("clearwater:refresh", update);
        return () => window.removeEventListener("clearwater:refresh", update);
      }, [page, pointName]);
      return decision;
    }

    // ── CTA event tracking helper ─────────────────────────────────────
    // Safe wrapper — does nothing if SDK not loaded (demo mode)
    const track = {
      applicationStart: (productId) =>
        window.clearwaterTrack?.applicationStart(productId),
      calculatorEngagement: (type) =>
        window.clearwaterTrack?.calculatorEngagement(type),
      productClick: (id, type) =>
        window.clearwaterTrack?.productClick(id, type),
      identifyUser: (email, firstName, lastName) =>
        window.clearwaterTrack?.identifyUser(email, firstName, lastName),
      articleClick: (id, topic) =>
        window.clearwaterTrack?.articleClick(id, topic),
    };

    // ── App ──────────────────────────────────────────────────────────
    function ClearwaterBank() {
      const [page, setPage] = useState("home");
      const [persona, setPersona] = useState("prospect");
      const [showZones, setShowZones] = useState(false);
      const [chatOpen, setChatOpen] = useState(false);
      const sdkReady = useSDKStatus();

      // Sync URL hash with page navigation.
      // Uses hash assignment (not pushState) because the Salesforce Interactions
      // SDK monitors hashchange events to re-evaluate isMatch functions and
      // trigger onRender → Personalization.fetch calls in the sitemap.
      // pushState does NOT fire hashchange, so the SDK wouldn't detect navigation.
      const navigateTo = (newPage) => {
        setPage(newPage);
        const newHash = newPage === "home" ? "" : "#" + newPage;
        const currentHash = window.location.hash || "";
        if (currentHash !== newHash) {
          if (newHash) {
            window.location.hash = newHash;
          } else {
            history.pushState(null, "", window.location.pathname);
            window.dispatchEvent(new HashChangeEvent("hashchange"));
          }
        }
        // Send page view event + fetch personalization for the new page
        if (window.clearwaterTrack && window.clearwaterTrack.navigateTo) {
          window.clearwaterTrack.navigateTo(newPage);
        }
      };

      // Listen for browser back/forward — keep React page state in sync with hash
      useEffect(() => {
        const onHashChange = () => {
          const hash = window.location.hash.replace("#", "") || "home";
          setPage(hash);
        };
        window.addEventListener("hashchange", onHashChange);
        return () => window.removeEventListener("hashchange", onHashChange);
      }, []);

      return (
        <div style={{ fontFamily:"'Inter',system-ui,sans-serif", background:C.bg, minHeight:"100vh", color:C.text }}>
          <DemoBar persona={persona} setPersona={setPersona} showZones={showZones} setShowZones={setShowZones} sdkReady={sdkReady}/>
          <Navbar page={page} setPage={navigateTo} persona={persona}/>
          <main>
            {page==="home"       && <HomePage        persona={persona} showZones={showZones} navigateTo={navigateTo}/>}
            {page==="loans"      && <LoansHubPage   persona={persona} showZones={showZones} navigateTo={navigateTo}/>}
            {page==="mortgage"   && <MortgagePage   persona={persona} showZones={showZones}/>}
            {page==="investment" && <InvestmentPage persona={persona} showZones={showZones}/>}
            {page==="dashboard"  && <DashboardPage  persona={persona} showZones={showZones}/>}
          </main>
          <div style={{ position:"fixed", bottom:24, right:24, zIndex:200 }}>
            <button onClick={() => setChatOpen(!chatOpen)} style={{ width:56, height:56, borderRadius:"50%", background:C.navy, border:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center", boxShadow:"0 4px 20px rgba(15,42,74,0.28)", position:"relative" }}>
              <Bot size={24} color="#fff"/>
              <div style={{ position:"absolute", top:0, right:0, width:16, height:16, background:"#10B981", borderRadius:"50%", border:"2px solid #fff", display:"flex", alignItems:"center", justifyContent:"center" }}>
                <Sparkles size={8} color="#fff"/>
              </div>
            </button>
            <AWACChat open={chatOpen} onClose={() => setChatOpen(false)}/>
          </div>
          <footer style={{ background:C.navy, color:"rgba(255,255,255,0.38)", padding:"28px 20px", marginTop:60, textAlign:"center", fontSize:12, lineHeight:1.8 }}>
            <div>© 2025 Clearwater Bank · ABN 12 345 678 901 · AFSL 123456 · Australian Credit Licence 123456</div>
            <div>This is a Salesforce Personalization demo environment. All rates, products, and customer data are fictional.</div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ClearwaterBank />);
  </script>
</body>
</html>
